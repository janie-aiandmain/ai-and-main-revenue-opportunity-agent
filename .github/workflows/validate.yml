name: Validate Worker

on:
  push:
    branches: [main, enterprise-hardening]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Deterministic regression and certification guards
        run: npm test
      - name: Local Worker durable recovery certification
        run: npm run integration:local
      - name: Fresh captured-output identity replay
        run: npm run certification:replay
      - name: Wrangler dry run
        run: npm run check
      - name: Isolated staging Worker dry run
        run: npm run certification:check
      - name: Hosted staging configuration dry run
        run: npm run staging:check
